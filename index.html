<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>North Country Radar -- My places &middot; North Country</title>
<!-- build 105030 -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap">
<style>
  :root {
    --bg: #0e1116; --panel: #161a22; --panel2: #1c212c;
    --line: rgba(255,255,255,.09); --txt: #eef1f6; --mut: #9aa3b2;
    --acc: #e8b34b;
    --r: 14px;
    --shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }

  /* ============ map ============ */
  #map { position: fixed; inset: 0; background: #14161c; }
  .maplibregl-canvas { filter: grayscale(1) invert(0.93) brightness(1.04) contrast(0.95); }
  .maplibregl-ctrl-attrib { font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: #7c8595; }

  /* ============ markers: NEVER moved, only faded ============
     First-principles rule: markers are created once per data change and
     never touched on map movement -- they cannot drift, fly, or glide.
     The ONLY permitted visual change is an opacity fade when the data
     set itself changes (mode/filter/search), so toggles feel smooth
     instead of jerky. No transform, no position animation, ever. */
  .mk { cursor: pointer; display: inline-block; transition: opacity .18s ease; }
  .mk * { transition: none !important; animation: none !important; }
  body.fading .mk { opacity: 0; }
  .pin { width: 26px; height: 33px; position: relative; }
  .mk .pin i {
    position: absolute; left: 1px; top: 1px; width: 24px; height: 24px;
    background: var(--pc, #fff);
    border: 2.5px solid rgba(255,255,255,.95);
    border-radius: 50% 50% 50% 6px;
    transform: rotate(-45deg);
    box-shadow: 0 3px 10px rgba(0,0,0,.55);
  }
  .mk .pin i::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 8px; height: 8px; margin: -4px 0 0 -4px;
    background: #fff; border-radius: 50%;
  }
  .mk .halo {
    position: absolute; inset: -22px; border-radius: 50%;
    pointer-events: none; opacity: 0;
  }
  .mk.sel .halo { opacity: 1; background: radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 65%); }
  .mk.closedm { opacity: .45; }
  .mk.closedm .pin i { filter: grayscale(1); }
  /* heat blob: warm amber radial, glued to the pin as its child */
  .heat {
    position: absolute; left: 50%; top: 100%; width: 120px; height: 120px;
    transform: translate(-50%, -50%); pointer-events: none;
    background: radial-gradient(circle, rgba(255,171,64,.30) 0%, rgba(255,171,64,0) 68%);
  }
  .noheat .mk .heat { display: none; }
  .mk .pin { position: relative; z-index: 1; }

  /* ============ header ============ */
  header {
    position: fixed; top: 12px; left: 12px; right: 12px; z-index: 20;
    display: flex; gap: 10px; align-items: center; pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .brand {
    background: rgba(13,14,19,.85); border: 1px solid var(--line);
    border-radius: var(--r); padding: 8px 14px; backdrop-filter: blur(12px);
    box-shadow: var(--shadow); white-space: nowrap;
  }
  .brand h1 { font: 800 16px Sora, Inter, sans-serif; margin: 0; letter-spacing: -.2px; }
  .brand p { font-size: 10.5px; color: var(--mut); margin: 2px 0 0; }
  #search {
    flex: 1; max-width: 420px; height: 44px; padding: 0 16px;
    background: rgba(13,14,19,.85); border: 1px solid var(--line); border-radius: 999px;
    color: var(--txt); font: 500 14px Inter, sans-serif; backdrop-filter: blur(12px);
    box-shadow: var(--shadow); outline: none;
  }
  #search::placeholder { color: #6b7484; }
  #search:focus { border-color: rgba(232,179,75,.55); }
  .modeseg {
    display: flex; background: rgba(13,14,19,.85); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px; backdrop-filter: blur(12px); box-shadow: var(--shadow);
  }
  .modeseg button {
    border: 0; background: transparent; color: var(--mut);
    font: 600 13px Inter, sans-serif; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .modeseg button.on { background: #2a3040; color: #fff; }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(13,14,19,.85); border: 1px solid var(--line); color: var(--txt);
    font-size: 18px; cursor: pointer; backdrop-filter: blur(12px); box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn:hover { border-color: rgba(232,179,75,.5); }

  /* ============ category chips ============ */
  #chips {
    position: fixed; top: 68px; left: 12px; right: 12px; z-index: 20;
    display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none;
  }
  #chips > * { pointer-events: auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(13,14,19,.85); border: 1px solid var(--line); color: var(--txt);
    font: 600 12.5px Inter, sans-serif; padding: 7px 13px; border-radius: 999px;
    cursor: pointer; backdrop-filter: blur(12px);
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pc, #888); }
  .chip.off { opacity: .42; }
  .chip:hover { border-color: rgba(232,179,75,.5); }

  /* ============ list panel ============ */
  #listbtn { display: none; }
  #listpanel {
    position: fixed; right: 12px; top: 120px; bottom: 70px; width: 340px; max-width: 86vw; z-index: 25;
    background: rgba(17,20,27,.96); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); backdrop-filter: blur(16px);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #listpanel.open { display: flex; }
  /* elegant scrollbar */
  #listitems { overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: #3a3f52 transparent; }
  #listitems::-webkit-scrollbar { width: 8px; }
  #listitems::-webkit-scrollbar-track { background: transparent; }
  #listitems::-webkit-scrollbar-thumb { background: #2e3344; border-radius: 8px; }
  #listitems::-webkit-scrollbar-thumb:hover { background: #e8b34b; }
  #listpanel .lp-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    font: 700 14px Inter, sans-serif;
  }
  #listpanel .lp-head button { background: none; border: 0; color: var(--mut); font-size: 18px; cursor: pointer; }
  .litem {
    display: flex; gap: 10px; align-items: center; padding: 10px 12px;
    border-radius: 10px; cursor: pointer; border: 1px solid transparent;
  }
  .litem:hover { background: rgba(255,255,255,.05); border-color: var(--line); }
  .litem .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .litem .t { font: 600 13.5px Inter, sans-serif; }
  .litem .s { font-size: 11.5px; color: var(--mut); margin-top: 2px; }

  /* ============ bottom sheet ============ */
  #sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 30;
    width: 560px; max-width: calc(100vw - 24px);
    background: rgba(19,22,30,.97); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 20px 20px 0 0; box-shadow: var(--shadow); backdrop-filter: blur(16px);
    transform: translateX(-50%) translateY(105%);
    transition: transform .28s cubic-bezier(.32,.72,.28,1);
    max-height: 62vh; display: flex; flex-direction: column;
  }
  #sheet.open { transform: translateX(-50%) translateY(0); }
  #sheet .grab { width: 44px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.18); margin: 10px auto 0; flex: none; }
  #sheetbody { overflow-y: auto; padding: 14px 20px 26px; }
  #sheet .x {
    position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--txt);
    font-size: 15px; cursor: pointer;
  }
  .shtitle { font: 800 21px Sora, Inter, sans-serif; margin: 6px 0 8px; padding-right: 36px; }
  .pills { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill {
    font: 700 10.5px Inter, sans-serif; letter-spacing: .6px; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--mut);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .pill.warn { color: #f0b35c; border-color: rgba(240,179,92,.4); background: rgba(240,179,92,.08); }
  .pill.bad { color: #ef8a8a; border-color: rgba(239,138,138,.4); background: rgba(239,138,138,.08); }
  .shrow { font-size: 13.5px; color: #c9d0dc; margin: 7px 0; line-height: 1.5; }
  .shrow b { color: var(--txt); font-weight: 600; }
  .shdesc { font-size: 13.5px; color: #c9d0dc; line-height: 1.65; margin: 10px 0; white-space: pre-wrap; }
  .shbtns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: #2a3040; border: 1px solid var(--line); color: var(--txt);
    font: 600 13px Inter, sans-serif; padding: 10px 16px; border-radius: 10px;
    cursor: pointer; text-decoration: none;
  }
  .btn:hover { border-color: rgba(232,179,75,.5); }
  .btn.primary { background: var(--acc); border-color: var(--acc); color: #1a1408; }
  .stars { color: var(--acc); letter-spacing: 2px; font-size: 15px; }
  .note {
    background: rgba(232,179,75,.07); border: 1px solid rgba(232,179,75,.25);
    border-radius: 10px; padding: 10px 13px; font-size: 13px; color: #e8d9b8;
    margin: 10px 0; line-height: 1.55;
  }

  /* ============ map controls ============ */
  #mapctl { position: fixed; right: 12px; bottom: 14px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
  #mapctl .iconbtn { border-radius: 12px; }

  #updated {
    position: fixed; left: 14px; bottom: 16px; z-index: 15;
    font-size: 10.5px; color: rgba(255,255,255,.38);
  }
  #empty {
    position: fixed; left: 50%; top: 44%; transform: translate(-50%,-50%); z-index: 15;
    background: rgba(13,14,19,.9); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 22px; font-size: 14px; color: var(--mut); display: none; text-align: center;
  }
  #empty.show { display: block; }
  #tip {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 40;
    background: rgba(13,14,19,.94); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; font-size: 13px; display: none; box-shadow: var(--shadow);
  }
  #tip.show { display: block; }

  /* ============ admin ============ */
  #admin { display: none; }
  body.admin #admin { display: block; }
  body.admin #map, body.admin header, body.admin #chips, body.admin #mapctl,
  body.admin #listbtn, body.admin #updated { display: none; }
  #admin { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding: 22px; }
  #admin .abar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    position: sticky; top: 0; background: var(--bg); padding: 6px 0 14px; z-index: 2;
  }
  #admin h2 { font: 800 20px Sora, Inter, sans-serif; margin: 0 12px 0 0; }
  .atabs { display: flex; gap: 6px; }
  .atabs button {
    background: var(--panel); border: 1px solid var(--line); color: var(--mut);
    font: 600 13px Inter, sans-serif; padding: 9px 16px; border-radius: 10px; cursor: pointer;
  }
  .atabs button.on { background: #2a3040; color: #fff; border-color: rgba(232,179,75,.4); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px;
  }
  .card h3 { font: 700 15px Inter, sans-serif; margin: 0 0 6px; }
  .card .meta { font-size: 12px; color: var(--mut); line-height: 1.6; }
  .card .row { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
  .sbtn {
    background: #2a3040; border: 1px solid var(--line); color: var(--txt);
    font: 600 12.5px Inter, sans-serif; padding: 8px 13px; border-radius: 8px; cursor: pointer;
  }
  .sbtn:hover { border-color: rgba(232,179,75,.5); }
  .sbtn.go { background: #2c5a34; border-color: #3f7a49; }
  .sbtn.danger { background: #5a2c2c; border-color: #7a3f3f; }
  .sbtn:disabled { opacity: .45; cursor: default; }
  .rec { border-left: 3px solid var(--acc); padding: 8px 12px; background: rgba(232,179,75,.06); border-radius: 0 8px 8px 0; font-size: 13px; margin: 9px 0; line-height: 1.55; }
  .rec.skip { border-color: #6b7484; background: rgba(255,255,255,.03); }
  .statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; }
  .stat .n { font: 800 24px Sora, Inter, sans-serif; }
  .stat .l { font-size: 11.5px; color: var(--mut); margin-top: 3px; }
  #admin input[type=text], #admin textarea, #admin select {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 8px; padding: 9px 11px; font: 500 13px Inter, sans-serif; margin: 4px 0;
  }
  #admin textarea { min-height: 70px; resize: vertical; }
  #admin label { font-size: 12px; color: var(--mut); display: block; margin-top: 8px; }
  .modal {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal.open { display: flex; }
  .modal .mbox {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    width: 620px; max-width: 94vw; max-height: 88vh; overflow-y: auto; padding: 20px 22px;
  }
  .modal .mbox h3 { margin: 0 0 12px; font: 700 17px Inter, sans-serif; }

  @media (max-width: 720px) {
    header { flex-wrap: wrap; gap: 8px; top: 10px; left: 10px; right: 10px;
      transition: opacity .25s ease, transform .25s ease; }
    .brand { order: 1; padding: 7px 12px; }
    .brand h1 { font-size: 14px; }
    .brand p { display: none; }
    .modeseg { order: 2; margin-left: auto; }
    .modeseg button { padding: 7px 12px; font-size: 12px; }
    #gearBtn { order: 3; width: 40px; height: 40px; }
    #homeBtnTop { order: 3; width: 40px; height: 40px; }
    #search { order: 4; flex: 1 1 100%; max-width: none; height: 42px;
      transition: opacity .25s ease, transform .25s ease; }
    /* no sidebar, no chips on mobile */
    #listpanel { display: none !important; }
    #chips { display: none !important; }
    #mapctl { right: 10px; bottom: 12px; transition: opacity .25s ease; }
    #updated { display: none; }
    /* auto-hide chrome while navigating */
    body.navigating header, body.navigating #mapctl { opacity: 0; pointer-events: none; }
    body.navigating #search { opacity: 0; }
    /* expandable sheet: peek / half / full */
    #sheet { width: calc(100vw - 16px); left: 8px; transform: translateX(0) translateY(105%);
      transition: transform .28s cubic-bezier(.32,.72,.28,1), height .22s ease; }
    #sheet.open { transform: translateX(0) translateY(0); }
    #sheet.dragging { transition: none; }
  }
</style>
</head>
<body>
<div id="map"></div>

<header>
  <div class="brand">
    <h1>North Country Radar</h1>
    <p>My places &middot; North Country</p>
  </div>
  <input id="search" type="text" placeholder="Search my places" autocomplete="off">
  <div class="modeseg" id="modeSeg" style="display:none">
    <button data-mode="events">Events</button>
    <button data-mode="places" class="on">Places</button>
  </div>
  <button class="iconbtn" id="homeBtnTop" title="Home view" style="background:#e8b34b;border-color:#e8b34b;color:#1a1a1a;font-weight:800">&#8962;</button>
  <button class="iconbtn" id="gearBtn" title="Admin">&#9881;</button>
</header>

<div id="chips"></div>

<button id="listbtn">&#9776; List</button>
<aside id="listpanel">
  <div class="lp-head"><span id="listtitle">Places</span><button id="listx" title="Close">&times;</button></div>
  <div id="listitems"></div>
</aside>

<div id="sheet">
  <div class="grab"></div>
  <button class="x" id="sheetx" title="Close">&times;</button>
  <div id="sheetbody"></div>
</div>

<div id="mapctl">
  <button class="iconbtn" id="zinBtn" title="Zoom in">+</button>
  <button class="iconbtn" id="zoutBtn" title="Zoom out">&minus;</button>
</div>

<div id="updated"></div>
<div id="empty"></div>
<div id="tip"></div>
<div id="admin"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
/* ================= config ================= */
var PALETTE = {
  Food: "#e2a63b", Coffee: "#c08252", Outdoors: "#5fa968",
  Orchard: "#db6e5c", Entertainment: "#a281e8", Study: "#6a9be8",
  Venues: "#e08bb0", Campus: "#7fc4c4"
};
var EVENT_COLOR = "#e8b34b";
var CATS = ["Food", "Coffee", "Outdoors", "Orchard", "Entertainment", "Study", "Venues", "Campus"];

/* ================= state ================= */
var state = {
  mode: "places",          // "places" | "events"
  events: [], places: [],
  cats: {},                // category -> false means hidden
  query: "",
  selected: null,
  markers: [],             // live maplibre Marker objects
  heatOn: true,
  admin: false,
  notes: {}
};
CATS.forEach(function (c) { state.cats[c] = true; });

/* ================= helpers ================= */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function tip(msg) {
  var t = $("tip"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove("show"); }, 2600);
}
function catColor(e) {
  if (e.kind === "event") return EVENT_COLOR;
  return PALETTE[e.category] || "#8a93a5";
}
function isClosed(e) {
  if (!e.hours) return false;
  return /closed/i.test(e.hours);
}
function distMi(e) {
  if (e.distMi != null) return e.distMi;
  return null;
}

/* ================= map =================
   FIRST PRINCIPLES: the map camera is set exactly twice --
   once on load (jumpTo, instant) and on explicit user control
   clicks (home/zoom, all jumpTo, instant). There is no easeTo,
   no flyTo, no animated zoom anywhere in this file. Markers are
   positioned by MapLibre itself and never touched on movement. */
var map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      basemap: {
        type: "raster",
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"],
        tileSize: 256, maxzoom: 19,
        attribution: "Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, OpenStreetMap contributors, and the GIS user community"
      }
    },
    layers: [{ id: "basemap", type: "raster", source: "basemap" }]
  },
  center: [-75.0, 44.6], zoom: 9,
  attributionControl: { compact: true }
});
var homeCam = null; // {center, zoom} captured after first framing

function jumpHome() {
  if (homeCam) { try { map.flyTo({ center: homeCam.center, zoom: homeCam.zoom, duration: 1400 }); } catch (err) {} }
}

/* ================= data ================= */
function loadData() {
  return Promise.all([
    fetch("events.json").then(function (r) {
      if (!r.ok) throw new Error("events.json " + r.status); return r.json();
    }),
    fetch("places.json").then(function (r) {
      if (!r.ok) throw new Error("places.json " + r.status); return r.json();
    })
  ]).then(function (res) {
    var now = new Date(); now.setHours(0, 0, 0, 0);
    state.events = (res[0].events || [])
      .filter(function (e) {
        if (!e.date) return true;
        var d = new Date(e.date + "T00:00:00");
        return d >= now;
      })
      .map(function (e) { e.kind = "event"; return e; });
    state.places = (res[1].places || [])
      .map(function (p) { p.kind = "place"; return p; });
    $("updated").textContent = "Updated " + (res[0].updated || res[1].updated || "");
    return { events: res[0], places: res[1] };
  });
}

function frameInitial() {
  var b = new maplibregl.LngLatBounds();
  state.events.forEach(function (e) { b.extend([e.lng, e.lat]); });
  state.places.forEach(function (p) { b.extend([p.lng, p.lat]); });
  if (b.isEmpty()) return;
  try {
    var cam = map.cameraForBounds(b, { padding: 90, maxZoom: 12 });
    if (cam) {
      homeCam = { center: cam.center, zoom: cam.zoom };
      map.jumpTo(homeCam); // instant. no animation. ever.
      return;
    }
  } catch (err) {}
  map.fitBounds(b, { padding: 90, maxZoom: 12, duration: 0 });
  try { homeCam = { center: map.getCenter().toArray(), zoom: map.getZoom() }; } catch (err) {}
}

/* ================= filtering ================= */
function visibleItems() {
  var items = state.mode === "events" ? state.events : state.places;
  var q = state.query.trim().toLowerCase();
  return items.filter(function (e) {
    if (state.mode === "places" && state.cats[e.category] === false) return false;
    if (q) {
      var hay = ((e.title || e.name || "") + " " + (e.venue || "") + " " + (e.town || "") +
                 " " + (e.desc || "") + " " + (e.category || "")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

/* Every pin is shown individually -- no clusters, no counts to decode.
   Pins sharing identical coordinates get a tiny deterministic spread. */
function spreadPins(items) {
  var groups = {};
  items.forEach(function (e) {
    var k = e.lat.toFixed(5) + "," + e.lng.toFixed(5);
    (groups[k] = groups[k] || []).push(e);
  });
  Object.keys(groups).forEach(function (k) {
    groups[k].forEach(function (e, i) {
      if (groups[k].length > 1) {
        var a = (i / groups[k].length) * Math.PI * 2;
        e._sx = e.lng + Math.cos(a) * 0.0012;
        e._sy = e.lat + Math.sin(a) * 0.0012;
      } else { e._sx = e.lng; e._sy = e.lat; }
    });
  });
}

/* ================= markers =================
   Built exactly once per render() call. render() is called only on:
   data load, mode switch, chip toggle, search input, admin edits.
   It is NEVER called on map movement. Markers therefore cannot move
   on their own -- MapLibre keeps them glued to their coordinates.
   Every pin is shown individually; no clusters, no counts to decode. */
function clearMarkers() {
  state.markers.forEach(function (m) { m.remove(); });
  state.markers = [];
}

function makePin(e) {
  var el = document.createElement("div");
  el.className = "mk" + (isClosed(e) ? " closedm" : "") + (state.selected === e.id ? " sel" : "");
  // heat glow scales with rating: unrated = faint whisper, 5 stars = full blaze
  var heat = document.createElement("div");
  heat.className = "heat";
  var r = (e.rating == null ? 0 : e.rating);
  heat.style.opacity = String(0.12 + (r / 5) * 0.88);
  var sz = Math.round(70 + (r / 5) * 90);
  heat.style.width = sz + "px"; heat.style.height = sz + "px";
  el.appendChild(heat);
  var pin = document.createElement("div");
  pin.className = "pin";
  pin.style.setProperty("--pc", catColor(e));
  pin.appendChild(document.createElement("i"));
  el.appendChild(pin);
  el.addEventListener("click", function (ev) {
    ev.stopPropagation();
    openSheet(e); // no camera movement. the pin is already where the user tapped.
  });
  return el;
}

function renderMarkers() {
  clearMarkers();
  var items = visibleItems();
  var empty = $("empty");
  if (!items.length) {
    empty.textContent = state.query ? "No matches." : "Nothing here yet.";
    empty.classList.add("show");
  } else empty.classList.remove("show");

  document.body.classList.toggle("noheat", !state.heatOn || map.getZoom() >= 13);

  spreadPins(items);
  items.forEach(function (e) {
    var m = new maplibregl.Marker({ element: makePin(e), anchor: "bottom", draggable: state.admin })
      .setLngLat([e._sx, e._sy]).addTo(map);
    if (state.admin) {
      m.on("dragstart", pushUndo);
      m.on("dragend", function () {
        var ll = m.getLngLat();
        e.lat = +ll.lat.toFixed(5); e.lng = +ll.lng.toFixed(5);
        e.approx = false;
        markDirtyPlaces();
        render();
      });
    }
    state.markers.push(m);
  });
}

function render() {
  renderChips();
  renderMarkers();
  renderList();
  if (state.selected) {
    var e = findById(state.selected);
    if (e) renderSheetBody(e);
  }
}

/* Smooth data-set switch: fade pins out, swap, fade in.
   Used for mode / chip / search changes so toggles feel polished.
   Positional motion is still impossible -- only opacity changes. */
function fadeRender() {
  document.body.classList.add("fading");
  setTimeout(function () {
    render();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        document.body.classList.remove("fading");
      });
    });
  }, 190);
}

function findById(id) {
  var all = state.events.concat(state.places);
  for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
  return null;
}

/* ================= list ================= */
function distToCenter(e, c) {
  // equirectangular approximation, good enough for sorting
  var dx = (e.lng - c.lng) * Math.cos(c.lat * Math.PI / 180), dy = e.lat - c.lat;
  return Math.sqrt(dx * dx + dy * dy);
}
function renderList() {
  var items = visibleItems().slice();
  // dynamic: only places in the current map view, nearest the center first
  try {
    var b = map.getBounds(), c = map.getCenter();
    items = items.filter(function (e) {
      return e.lng >= b.getWest() && e.lng <= b.getEast() && e.lat >= b.getSouth() && e.lat <= b.getNorth();
    });
    items.sort(function (a, b2) { return distToCenter(a, c) - distToCenter(b2, c); });
  } catch (err) {
    items.sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
  }
  $("listtitle").textContent = "Nearby (" + items.length + ")";
  var box = $("listitems");
  box.innerHTML = "";
  items.forEach(function (e) {
    var d = document.createElement("div");
    d.className = "litem";
    var sub = e.kind === "event"
      ? [e.date, e.time, e.venue || e.town].filter(Boolean).join(" · ")
      : [e.town, e.category].filter(Boolean).join(" · ");
    d.innerHTML = '<span class="dot" style="background:' + catColor(e) + '"></span>' +
      '<span><span class="t">' + esc(e.title || e.name) + '</span><br><span class="s">' + esc(sub) + '</span></span>';
    d.addEventListener("click", function () { openSheet(e); });
    box.appendChild(d);
  });
}

/* sheet snap states (mobile): peek -> half -> full */
var SHEET_SNAPS = [84, null, null]; // px; half/full computed from viewport
function sheetSnaps() {
  var vh = window.innerHeight;
  return [84, Math.round(vh * 0.45), Math.round(vh * 0.88)];
}
var sheetState = -1; // -1 closed, 0 peek, 1 half, 2 full
function isMobileSheet() { return window.innerWidth <= 720; }
function setSheetHeight(px, animate) {
  var sh = $("sheet");
  if (!isMobileSheet()) { sh.style.height = ""; return; }
  if (animate === false) sh.classList.add("dragging");
  else sh.classList.remove("dragging");
  sh.style.height = px + "px";
  sh.style.maxHeight = "none";
}
function snapSheet(idx) {
  sheetState = idx;
  if (idx < 0) { closeSheet(true); return; }
  setSheetHeight(sheetSnaps()[idx], true);
}
function openSheet(e) {
  state.selected = e.id;
  renderSheetBody(e);
  var sh = $("sheet");
  sh.classList.add("open");
  renderMarkers();
  if (isMobileSheet()) { snapSheet(0); } // start at peek
  else { sh.style.height = ""; }
  try { map.flyTo({ center: [e.lng, e.lat], zoom: Math.max(map.getZoom(), 14), duration: 1400 }); }
  catch (err) {}
  try { history.replaceState({ sel: e.id }, "", "#" + e.kind + "=" + encodeURIComponent(e.id)); }
  catch (err) {}
}
function closeSheet(silent) {
  state.selected = null;
  sheetState = -1;
  var sh = $("sheet");
  sh.classList.remove("open");
  sh.style.height = "";
  renderMarkers();
  if (!silent) { try { history.replaceState({}, "", location.pathname + location.search); } catch (err) {} }
}
/* drag the grab handle / peek to expand */
(function () {
  var sh = $("sheet");
  var startY = 0, startH = 0, dragging = false, moved = false;
  function grabZone(t) {
    return t.closest && (t.closest(".grab") || (sheetState === 0 && t.closest("#sheet")));
  }
  sh.addEventListener("touchstart", function (e) {
    if (!isMobileSheet() || sheetState < 0 || !grabZone(e.target)) return;
    dragging = true; moved = false;
    startY = e.touches[0].clientY;
    startH = sh.getBoundingClientRect().height;
  }, { passive: true });
  sh.addEventListener("touchmove", function (e) {
    if (!dragging) return;
    var dy = startY - e.touches[0].clientY;
    if (Math.abs(dy) > 8) moved = true;
    var snaps = sheetSnaps();
    var nh = Math.min(snaps[2], Math.max(40, startH + dy));
    setSheetHeight(nh, false);
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  sh.addEventListener("touchend", function (e) {
    if (!dragging) return;
    dragging = false;
    sh.classList.remove("dragging");
    var snaps = sheetSnaps();
    var h = sh.getBoundingClientRect().height;
    if (!moved) { // tap: peek->half->full cycle
      snapSheet(sheetState >= 2 ? 0 : sheetState + 1);
      return;
    }
    if (h < (snaps[0] + snaps[1]) / 2) {
      if (h < snaps[0] * 0.6) snapSheet(-1); // dragged down past peek: dismiss
      else snapSheet(0);
    } else if (h < (snaps[1] + snaps[2]) / 2) snapSheet(1);
    else snapSheet(2);
  });
})();

/* ================= boot ================= */
function boot() {
  loadData().then(function () {
    frameInitial();          // camera set BEFORE any marker exists
    if (new URLSearchParams(location.search).get("admin") === "1") setAdmin(true);
    render();                // markers created once, at final positions
    // deep link: show the place, no camera flight
    var m = location.hash.match(/^#(place|event)=(.+)$/);
    if (m) {
      var e = findById(decodeURIComponent(m[2]));
      if (e) {
        state.mode = e.kind === "place" ? "places" : "events";
        document.querySelectorAll("#modeSeg button").forEach(function (x) {
          x.classList.toggle("on", x.getAttribute("data-mode") === state.mode);
        });
        render();
        try { map.jumpTo({ center: [e.lng, e.lat] }); } catch (err) {}
        openSheet(e);
      }
    }
  }).catch(function (err) {
    var el = $("empty");
    el.textContent = "Could not load data: " + err.message;
    el.classList.add("show");
  });
}
boot();
/* ================= admin =================
   Lightweight in-page admin: drag pins to reposition, edit details,
   download updated JSON. The full staging workflow lives in admin.html. */
var undoStack = [], redoStack = [];

function snapData() {
  return {
    events: JSON.parse(JSON.stringify(state.events)),
    places: JSON.parse(JSON.stringify(state.places))
  };
}
function pushUndo() {
  var s = snapData(), top = undoStack[undoStack.length - 1];
  if (top && JSON.stringify(top) === JSON.stringify(s)) return;
  undoStack.push(s);
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
  updateUndoBtns();
}
function restoreData(snap) {
  state.events = JSON.parse(JSON.stringify(snap.events));
  state.places = JSON.parse(JSON.stringify(snap.places));
  state.events.forEach(function (e) { e.kind = "event"; });
  state.places.forEach(function (p) { p.kind = "place"; });
  render();
}
function updateUndoBtns() {
  $("undoBtn").disabled = !undoStack.length;
  $("redoBtn").disabled = !redoStack.length;
}
function markDirtyEvents() { var b = $("pubBtn"); if (b) b.textContent = "Publish \u25cf"; }
function markDirtyPlaces() { var b = $("pubBtn"); if (b) b.textContent = "Publish \u25cf"; }

function setAdmin(on) {
  state.admin = on;
  document.body.classList.toggle("admin", on);
  if (on) { touchAdminSession(); pushUndo(); }
  updateUndoBtns();
  closeSheet();
  renderMarkers();
}
/* Admin session: stays alive 10 minutes from last activity (sliding window). */
var ADMIN_TIMEOUT = 10 * 60 * 1000;
function adminSessionValid() {
  return Date.now() < parseInt(sessionStorage.getItem("radar-admin-until") || "0", 10);
}
function touchAdminSession() {
  if (state.admin) sessionStorage.setItem("radar-admin-until", String(Date.now() + ADMIN_TIMEOUT));
}
setInterval(function () {

["click", "keydown"].forEach(function (ev) {

function download(name, obj) {
  var blob = new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function cleanEvent(e) {

/* edit modal */

      "</select>";
    h += fld("Hours", "hours", e.hours);
  }
  h += fld("Town", "town", e.town);
  h += fld("Description", "desc", e.desc, true);
  h += fld("Link", "link", e.link);
  h += fld("Note (shown on card)", "note", e.note, true);

    h += '<label>Rating (drives heat glow)</label><div id="f_stars" style="font-size:26px;cursor:pointer;letter-spacing:4px"></div>';
  }
  h += '<div class="row" style="display:flex;gap:8px;margin-top:14px;">' +

    '<button class="sbtn" id="f_cancel">Cancel</button></div>';

    '<button class="sbtn danger" id="f_del">Delete place</button></div>';

    '<button class="sbtn danger" id="f_del">Delete event</button></div>';
  $("mbox").innerHTML = h;

  function val(k) { var el = $("f_" + k); return el ? el.value.trim() : ""; }
  var editRating = (e.rating == null ? 0 : e.rating);
  function drawEditStars() {
    var el = $("f_stars"); if (!el) return;
    el.innerHTML = [1, 2, 3, 4, 5].map(function (i) {
      return '<span data-i="' + i + '" style="color:' + (i <= editRating ? "#e8b34b" : "#3a3f52") + '">&#9733;</span>';
    }).join("");
    el.querySelectorAll("span").forEach(function (sp) {
      sp.addEventListener("click", function () {
        var i = parseInt(sp.dataset.i, 10);
        editRating = (i === editRating) ? 0 : i; // tap same star to clear
        drawEditStars();
      });

  }
  drawEditStars();

    pushUndo();
    if (isEv) {
      e.title = val("title"); e.date = val("date"); e.time = val("time"); e.venue = val("venue");
      markDirtyEvents();
    } else {
      e.name = val("title"); e.category = val("category"); e.hours = val("hours");
      e.rating = editRating || null;
      markDirtyPlaces();
    }
    e.town = val("town"); e.desc = val("desc"); e.link = val("link") || null; e.note = val("note");
    $("modal").classList.remove("open");

    $("modal").classList.remove("open");
    closeSheet();
  });

    "Hit Publish when you're done -- it goes live in ~2 minutes. No files to download.</div></div>" +
    '<div class="card"><h3>Full admin</h3><div class="meta">Deeper work lives in ' +
    '<a href="admin.html" style="color:var(--acc)">admin.html</a>.</div></div></div>';

  $("exitAdminBtn").addEventListener("click", function () { setAdmin(false); });
  $("undoBtn").addEventListener("click", function () {
    if (!undoStack.length) return;
    redoStack.push(snapData());
    restoreData(undoStack.pop());
    updateUndoBtns();
  });
  $("redoBtn").addEventListener("click", function () {
    if (!redoStack.length) return;
    undoStack.push(snapData());
    restoreData(redoStack.pop());
    updateUndoBtns();
  });
  $("discardBtn").addEventListener("click", function () {
    if (confirm("Throw away all changes made in this admin session?")) location.reload();
  });
  $("pubBtn").addEventListener("click", publishPlaces);
}
async function publishPlaces() {
  var t = ghToken();
  if (!t) { tip("No GitHub token saved -- add one in admin.html settings first"); return; }
  var btn = $("pubBtn"); btn.disabled = true; btn.textContent = "Publishing...";
  try {
    var get = await fetch("https://api.github.com/repos/jmeyers-51/clarksonradar/contents/places.json?ref=main", {
      headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" } });
    if (!get.ok) throw new Error("read failed: " + get.status);
    var meta = await get.json();
    var body = { updated: new Date().toISOString().slice(0, 10), places: state.places.map(cleanPlace) };
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(body, null, 1))));
    var put = await fetch("https://api.github.com/repos/jmeyers-51/clarksonradar/contents/places.json", {
      method: "PUT",
      headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json",
                 "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Quick edit: update places (" + state.places.length + ")",
                             content: content, sha: meta.sha, branch: "main" })
    });
    if (!put.ok) throw new Error("write failed: " + put.status);
    tip("Published -- live in ~2 minutes");
  } catch (e) { tip("Publish failed: " + e.message); }
  btn.disabled = false; btn.textContent = "Publish";
}
buildAdminBar();
</script>
