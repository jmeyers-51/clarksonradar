<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>North Country Radar — Events &amp; places · St. Lawrence County</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* ============ design tokens ============ */
  :root {
    --ease: cubic-bezier(.32,.72,.24,1);
    --d1: 200ms; --d2: 350ms;
    --bg: #0d0e13; --panel: #16171d; --panel2: #1d1e26; --line: #2a2b35;
    --txt: #f4f4f6; --mut: #a7a8b4; --dim: #6b6c78;
    --acc: #5b8def;
    --shadow: 0 16px 48px rgba(0,0,0,.5);
    --r: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--txt);
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; }
  #map { position: fixed; inset: 0; }
  /* dark grayscale basemap; pins are DOM (not canvas) so their colors stay vivid */
  .maplibregl-canvas { filter: grayscale(1) invert(0.93) brightness(1.04) contrast(0.95); }

  /* ============ top bar ============ */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px; }
  .brand { font-family: 'Sora', 'Inter', sans-serif; font-weight: 800; font-size: 17px;
    letter-spacing: -.3px; background: rgba(13,14,19,.82); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px;
    white-space: nowrap; }
  .brand small { display: block; font-family: 'Inter', sans-serif; font-weight: 500;
    font-size: 10.5px; color: var(--mut); letter-spacing: .4px; }
  .searchwrap { flex: 1; max-width: 420px; position: relative; }
  #search { width: 100%; background: rgba(13,14,19,.82); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 14px; color: var(--txt);
    padding: 12px 16px 12px 40px; font-size: 14.5px; font-family: 'Inter', sans-serif; }
  #search:focus { outline: none; border-color: var(--acc); }
  #search::placeholder { color: var(--dim); }
  .searchwrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; stroke: var(--dim); }
  .modeseg { display: flex; background: rgba(13,14,19,.82); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
  .modeseg button { border: 0; background: none; color: var(--mut); font-weight: 700;
    font-size: 13.5px; padding: 8px 16px; border-radius: 10px; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: all var(--d1) var(--ease); }
  .modeseg button.on { background: var(--panel2); color: var(--txt); }
  .gearbtn { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0;
    background: rgba(13,14,19,.82); backdrop-filter: blur(12px);
    border: 1px solid var(--line); color: var(--mut); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--d1) var(--ease); text-decoration: none; }
  .gearbtn:hover { color: var(--txt); border-color: #3a3b45; }
  .gearbtn svg { width: 20px; height: 20px; }

  /* ============ legend: always visible, functional ============ */
  .legendbar { position: fixed; z-index: 40; left: 0; right: 0;
    top: calc(66px + env(safe-area-inset-top));
    display: flex; gap: 8px; padding: 0 14px; overflow-x: auto;
    scrollbar-width: none; }
  .legendbar::-webkit-scrollbar { display: none; }
  .lchip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
    background: rgba(13,14,19,.82); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--txt); font-size: 12.5px; font-weight: 600;
    padding: 8px 14px; cursor: pointer; font-family: 'Inter', sans-serif;
    transition: all var(--d1) var(--ease); }
  .lchip .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .lchip.off { opacity: .38; }
  .lchip:active { transform: scale(.94); }
  .lchip.all { color: var(--mut); }

  /* ============ map controls ============ */
  .mapctl { position: fixed; right: 14px; bottom: calc(24px + env(safe-area-inset-bottom));
    z-index: 40; display: flex; flex-direction: column; gap: 8px; }
  .mapctl button { width: 44px; height: 44px; border-radius: 13px;
    background: rgba(13,14,19,.85); backdrop-filter: blur(12px);
    border: 1px solid var(--line); color: var(--txt); font-size: 19px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform var(--d1) var(--ease); }
  .mapctl button:active { transform: scale(.9); }
  .mapctl button svg { width: 18px; height: 18px; }

  /* ============ markers ============
     MapLibre positions the wrapper via transform, but our own `position: relative`
     (needed to contain the pring/halo) ties with `.maplibregl-marker`'s absolute
     positioning and wins on source order -- without inline-block the wrapper
     becomes a full-width block and the pring/bubble stretch across the map. */
  .mk { cursor: pointer; position: relative; display: inline-block; vertical-align: top; }
  .mk .dot { width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.92);
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
    transition: transform var(--d1) var(--ease), opacity var(--d1) var(--ease); }
  .mk .pring { position: absolute; inset: -7px; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.55); pointer-events: none; }
  .mk .halo { position: absolute; inset: -22px; border-radius: 50%; pointer-events: none; }
  .mk.sel .dot { transform: scale(1.45); }
  .mk.dim .dot { opacity: .3; }
  .mk.born .dot { animation: pop var(--d2) var(--ease); }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .mk .bub { min-width: 30px; height: 30px; border-radius: 15px; padding: 0 9px;
    background: var(--acc); color: #fff; font-weight: 800; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid rgba(255,255,255,.92); box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  .mk.closedm .dot { filter: grayscale(1); opacity: .55; }
  .mtip { position: fixed; z-index: 60; transform: translate(-50%, -100%);
    background: rgba(13,14,19,.92); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 12px; font-size: 12.5px; font-weight: 600; pointer-events: none;
    display: none; white-space: nowrap; }

  /* ============ bottom sheet ============ */
  .sheet { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%) translateY(110%);
    bottom: calc(14px + env(safe-area-inset-bottom)); width: min(520px, calc(100vw - 20px));
    max-height: 82vh; background: var(--panel); border: 1px solid var(--line);
    border-radius: 24px; box-shadow: var(--shadow);
    transition: transform var(--d2) var(--ease);
    display: flex; flex-direction: column; overflow: hidden; }
  .sheet.open { transform: translateX(-50%) translateY(0); }
  .sheet .grab { padding: 12px 0 4px; cursor: grab; flex-shrink: 0; touch-action: none; }
  .sheet .grab::after { content: ''; display: block; width: 46px; height: 5px; border-radius: 3px;
    background: #3a3b45; margin: 0 auto; }
  .sheet .shead { display: flex; align-items: flex-start; gap: 10px; padding: 6px 20px 0; flex-shrink: 0; }
  .sheet .shead .tt { flex: 1; min-width: 0; }
  .sheet h2 { font-family: 'Sora', 'Inter', sans-serif; font-size: 21px; margin: 0;
    font-weight: 800; letter-spacing: -.3px; line-height: 1.25; }
  .sheet .x { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    font-size: 16px; cursor: pointer; }
  .sheet .x:active { transform: scale(.9); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    padding: 5px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.cat { background: var(--panel2); border: 1px solid var(--line); color: var(--txt); }
  .chip.town { background: transparent; border: 1px solid var(--line); color: var(--mut); }
  .chip.ok { background: #123f2c; color: #4fe08f; }
  .chip.warn { background: #4a2f12; color: #ffb35c; }
  .chip.bad { background: #3a2226; color: #ff9d9d; }
  .sheet .keyline { padding: 10px 20px 0; color: var(--mut); font-size: 14px; font-weight: 500; flex-shrink: 0; }
  .sheet .sbody { overflow-y: auto; padding: 0 20px 20px; }
  .sheet[data-detent="peek"] .sbody .more { display: none; }
  .sheet[data-detent="peek"] .sbody .peekonly { display: block; }
  .sheet .more { display: block; }
  .sheet .peekonly { display: none; }
  .sheet .expandhint { display: flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--dim); font-size: 12.5px; font-weight: 600; padding: 12px 0 4px; cursor: pointer; }
  .sheet[data-detent="full"] .expandhint { display: none; }
  .sheet h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim);
    margin: 20px 0 8px; font-weight: 700; }
  .factgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fact { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .fact b { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--dim); margin-bottom: 3px; font-weight: 700; }
  .fact span { font-size: 14px; font-weight: 600; }
  .desc { font-size: 14.5px; line-height: 1.6; color: #d7d7de; margin: 12px 0 0; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-size: 14.5px; font-weight: 700;
    cursor: pointer; text-align: center; text-decoration: none; font-family: 'Inter', sans-serif;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform var(--d1) var(--ease); }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--acc); color: #fff; }
  .btn.ghost { background: var(--panel2); color: var(--txt); border: 1px solid var(--line); }
  .jdnotes { background: #221d10; border: 1px solid #4a3d1c; border-radius: 12px;
    padding: 12px 14px; margin-top: 16px; }
  .jdnotes .lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px;
    color: #d8b45a; font-weight: 700; margin-bottom: 4px; }
  .jdnotes .body { font-size: 14px; color: #f0e2c0; }
  .stars { color: #f0bd37; letter-spacing: 2px; font-size: 15px; }
  .freshline { display: flex; align-items: center; gap: 8px; margin-top: 14px;
    font-size: 12.5px; color: var(--dim); }

  /* ============ list panel ============ */
  .listpanel { position: fixed; z-index: 45; top: calc(122px + env(safe-area-inset-top));
    left: 14px; width: 340px; max-width: calc(100vw - 28px); max-height: calc(100vh - 220px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(-115%); transition: transform var(--d2) var(--ease); }
  .listpanel.open { transform: none; }
  .listpanel .lhead { display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 8px; flex-shrink: 0; }
  .listpanel .lhead b { font-family: 'Sora', sans-serif; font-size: 16px; }
  .listpanel .lhead button { background: none; border: 0; color: var(--mut); font-size: 18px; cursor: pointer; }
  .listpanel .cards { overflow-y: auto; padding: 4px 12px 14px; }
  .node { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px;
    cursor: pointer; transition: background var(--d1); }
  .node:hover { background: var(--panel2); }
  .node:active { transform: scale(.98); }
  .node .ndot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    border: 2.5px solid rgba(255,255,255,.9); }
  .node .nmain { min-width: 0; }
  .node .ntitle { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .nsub { font-size: 12.5px; color: var(--mut); margin-top: 2px; }
  .listtoggle { position: fixed; z-index: 40; left: 14px;
    bottom: calc(24px + env(safe-area-inset-bottom));
    background: rgba(13,14,19,.85); backdrop-filter: blur(12px);
    border: 1px solid var(--line); color: var(--txt); border-radius: 999px;
    padding: 12px 20px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: 'Inter', sans-serif; display: none; align-items: center; gap: 8px; }
  .listtoggle.show { display: inline-flex; }

  .empty { position: fixed; z-index: 40; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(13,14,19,.9); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 28px; font-size: 14.5px; color: var(--mut); display: none; text-align: center; }
  .empty.show { display: block; }

  .toast { position: fixed; z-index: 80; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(20px); background: var(--panel2);
    border: 1px solid var(--line); padding: 13px 24px; border-radius: 14px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: all var(--d2) var(--ease); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  .updated { position: fixed; z-index: 30; left: 14px; bottom: calc(24px + env(safe-area-inset-bottom));
    font-size: 11px; color: var(--dim); }
  body.listopen .updated { display: none; }

  .admintools { position: fixed; z-index: 70; top: calc(66px + env(safe-area-inset-top)); right: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; display: none; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mut);
    box-shadow: var(--shadow); max-width: calc(100vw - 28px); flex-wrap: wrap; }
  body.admin .admintools { display: flex; }
  .admintools button { background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 9px; padding: 8px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    font-family: 'Inter', sans-serif; }
  .admintools button:disabled { opacity: .4; }

  @media (max-width: 720px) {
    .brand small { display: none; }
    .brand { font-size: 14px; padding: 9px 13px; }
    .modeseg button { padding: 8px 11px; font-size: 12.5px; }
    #search { font-size: 13.5px; }
    .listpanel { top: auto; bottom: calc(86px + env(safe-area-inset-bottom)); left: 10px; right: 10px;
      width: auto; max-height: 44vh; transform: translateY(115%); }
    .listpanel.open { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand">North Country Radar<small>Events &amp; places · St. Lawrence County</small></div>
  <div class="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Search events or places" autocomplete="off">
  </div>
  <div class="modeseg" id="modeSeg">
    <button data-mode="events" class="on">Events</button>
    <button data-mode="places">Places</button>
  </div>
  <a class="gearbtn" href="./admin.html" title="Admin settings" aria-label="Admin settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </a>
</div>

<div class="legendbar" id="legendBar" aria-label="Filter by category"></div>

<div class="mapctl">
  <button id="homeBtn" title="Reset to full county view" aria-label="Reset view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
  </button>
  <button id="zinBtn" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="zoutBtn" title="Zoom out" aria-label="Zoom out">&minus;</button>
</div>

<button class="listtoggle" id="listToggle">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
  <span id="listToggleTxt">List</span>
</button>

<aside class="listpanel" id="listPanel" aria-label="Results list">
  <div class="lhead"><b id="listTitle">In view</b><button id="listClose" aria-label="Close list">&times;</button></div>
  <div class="cards" id="cards"></div>
</aside>

<div class="sheet" id="sheet" data-detent="peek" role="dialog" aria-modal="false">
  <div class="grab" id="sheetGrab"></div>
  <div class="shead">
    <div class="tt"><h2 id="sheetTitle"></h2><div class="chips" id="sheetChips"></div></div>
    <button class="x" id="sheetX" aria-label="Close">&times;</button>
  </div>
  <div class="keyline" id="sheetKey"></div>
  <div class="sbody" id="sheetBody"></div>
</div>

<div class="empty" id="empty">Nothing in view. Try another search.</div>
<div class="updated" id="updated"></div>
<div class="toast" id="toast"></div>

<div class="admintools" id="admintools">
  <span>Admin: drag pins to move them</span>
  <button id="undoBtn">Undo</button>
  <button id="redoBtn">Redo</button>
  <button id="dlBtn">Save events</button>
  <button id="dlBtn2">Save places</button>
  <button id="discardBtn">Discard</button>
  <button id="exitAdminBtn">Exit</button>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";

  /* ================= color taxonomy: color MEANS something =================
     Places: color = what it IS (category). Events: color = WHEN it is. */
  var PLACE_COLORS = {
    "Food": "#e8833a",
    "Coffee": "#8d6e63",
    "Outdoors": "#43a047",
    "Orchard": "#f9a825",
    "Entertainment": "#ab47bc",
    "Study": "#42a5f5"
  };
  var EVENT_COLORS = { "today": "#ef5350", "week": "#ff9800", "later": "#42a5f5" };
  var EVENT_LABELS = { "today": "Today", "week": "This week", "later": "Upcoming" };

  function hexA(hex, a) {
    var h = (hex || "#fff").replace("#", "");
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return "rgba(" + parseInt(h.slice(0,2),16) + "," + parseInt(h.slice(2,4),16) + "," + parseInt(h.slice(4,6),16) + "," + a + ")";
  }

  /* ================= state ================= */
  var state = {
    mode: "events", events: [], places: [], notes: {},
    nodes: {}, clusters: [],
    selected: null, sheetDetent: "peek",
    query: "", activeCats: {},
    admin: false, dirty: false,
    listOpen: false
  };
  var homeBounds = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }

  /* ================= time helpers ================= */
  function dayStart(d) { var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function parseDay(s) {
    if (!s) return null;
    var p = String(s).split("-"); if (p.length < 3) return null;
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function eventBucket(e) {
    var d = parseDay(e.date); if (!d) return "later";
    var diff = Math.round((dayStart(d) - dayStart(new Date())) / 86400000);
    if (diff <= 0) return "today";
    if (diff <= 7) return "week";
    return "later";
  }
  function fmtDate(s) {
    var d = parseDay(s); if (!d) return "";
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }
  function fmtMonth(s) {
    var d = parseDay(s); if (!d) return "";
    return d.toLocaleDateString("en-US", { month: "short", year: "numeric" });
  }
  function freshness(p) {

    var days = (Date.now() - new Date(p.verified + "T12:00:00")) / 86400000;
    if (days > 180) return { label: "Needs re-check", cls: "warn", dot: "#ffb35c" };

  /* ================= map ================= */

  /* ---- heat: warm density glow under clusters ---- */

    var items = (state.mode === "events" ? state.events : state.places)
      .filter(function (e) { return state.mode === "events" ? visible(e) : visiblePlace(e); });
    return { type: "FeatureCollection", features: items.map(function (e) {
      return { type: "Feature", properties: {}, geometry: { type: "Point", coordinates: [e.lng, e.lat] } };
    }) };

          "heatmap-color": ["interpolate", ["linear"], ["heatmap-density"],

            0.45, "rgba(245,175,45,0.7)", 0.7, "rgba(250,160,35,0.85)", 1, "rgba(255,190,70,0.95)"],
          "heatmap-radius": ["interpolate", ["linear"], ["zoom"], 8, 30, 12, 44],

  /* ---- markers ---- */

  function spreadPos(e, i, n) {

  function addNodeMarker(p, born) {

  function addCluster(cell) {
    var slng = 0, slat = 0, n = cell.length;
    cell.forEach(function (p) { slng += p.pos.lng; slat += p.pos.lat; });
    var el = document.createElement("div");
    el.className = "mk born";

    el.appendChild(bub);

    });

  function renderNodes() {
    var had = state.prevIds || {};

    var items = (state.mode === "events" ? state.events : state.places)
      .filter(function (e) { return state.mode === "events" ? visible(e) : visiblePlace(e); });
    var groups = {};
    items.forEach(function (e) {
      var k = e.lat.toFixed(5) + "," + e.lng.toFixed(5);
      (groups[k] = groups[k] || []).push(e);

    var pts = [];
    Object.keys(groups).forEach(function (k) {
      groups[k].forEach(function (e, i) {

  function renderSheet(e) {

  function download(name, obj) {

  }
  function cleanEvent(e) {

      desc: e.desc || "", link: e.link || null, source: e.source || "Radar" };

  function cleanPlace(p) {

  });
  $("dlBtn").addEventListener("click", function () {
    download("events.json", { updated: new Date().toISOString().slice(0, 10),
      events: state.events.map(cleanEvent) });
    state.dirty = false; $("dlBtn").textContent = "Save events";
    toast("events.json saved — send it to be pushed live");
  });
  $("dlBtn2").addEventListener("click", function () {
    download("places.json", { places: state.places.map(cleanPlace) });
    state.dirty = false; $("dlBtn2").textContent = "Save places";
    toast("places.json saved — send it to be pushed live");
  });

  /* ================= notes backend ================= */
  var NOTES_API_URL = "https://script.google.com/a/macros/clarkson.edu/s/AKfycbwy6VmnhyBxmteJ9HQO6ZGljcqCmth6ToJ6GS_m-NZZZU3iIVG5RpS2TmsY1bUwQz-NAA/exec";
  function loadNotes() {
    fetch(NOTES_API_URL + "?action=list", { mode: "cors" }).then(function (r) { return r.json(); })
      .then(function (j) {
        (j.notes || []).forEach(function (n) { state.notes[n.place_id] = n; });
        if (state.selected) { var e = byId(state.selected); if (e) renderSheet(e); }
      }).catch(function () {});
  }

  /* ================= boot ================= */
  Promise.all([
    fetch("./events.json", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("events.json " + r.status); return r.json(); }),
    fetch("./places.json", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("places.json " + r.status); return r.json(); })
  ]).then(function (res) {
    var data = res[0], pdata = res[1];
    state.events = (data.events || []).map(function (e) { e.kind = "event"; return e; });
    state.places = (pdata.places || []).map(function (p) { p.kind = "place"; p.title = p.name; return p; });
    $("updated").textContent = "Updated " + (data.updated || "");
    if (new URLSearchParams(location.search).get("admin") === "1") setAdmin(true);
    renderAll();
    loadNotes();
    var bounds = new maplibregl.LngLatBounds();
    state.events.forEach(function (e) { bounds.extend([e.lng, e.lat]); });
    state.places.forEach(function (p) { bounds.extend([p.lng, p.lat]); });
    if (!bounds.isEmpty()) {
      homeBounds = bounds;
      map.fitBounds(bounds, { padding: 90, maxZoom: 12, duration: 0 });
    }
    var m = location.hash.match(/^#(place|event)=(.+)$/);
    if (m) {
      var e = byId(decodeURIComponent(m[2]));
      if (e) {
        state.mode = e.kind === "place" ? "places" : "events";
        document.querySelectorAll("#modeSeg button").forEach(function (x) {
          x.classList.toggle("on", x.getAttribute("data-mode") === state.mode);
        });
        $("search").placeholder = state.mode === "events" ? "Search events" : "Search places";
        renderAll();
        openSheetFor(e, false);
      }
    }
  }).catch(function (err) {
    $("empty").textContent = "Could not load data: " + err.message;
    $("empty").classList.add("show");
  });
})();
</script>
</body>
</html>
