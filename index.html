<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0b0e10" />
<link rel="icon" href="data:," />
<title>North Country Events Radar</title>
<link rel="preconnect" href="https://unpkg.com" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #f2f5f4;
    --muted: #9aa7a3;
    --glass: rgba(14, 18, 20, 0.82);
    --glass-2: rgba(20, 26, 29, 0.92);
    --line: rgba(255, 255, 255, 0.10);
    --accent: #e8e4da;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b0e10; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #map { position: fixed; inset: 0; }

  /* floating top bar */
  .topbar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    width: min(680px, calc(100% - 24px));
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; z-index: 10;
  }
  .topbar .row1 { display: flex; align-items: center; gap: 10px; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; white-space: nowrap; }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0; }
  #search {
    flex: 1; background: rgba(255,255,255,0.07); border: 1px solid var(--line);
    border-radius: 10px; color: var(--ink); padding: 8px 12px; font: inherit; font-size: 14px;
    outline: none; min-width: 0;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: rgba(255,255,255,0.28); }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #101414; font-weight: 600; }
  .count { font-size: 11.5px; color: var(--muted); margin-left: auto; align-self: center; white-space: nowrap; }

  /* legend */
  .legend-toggle {
    position: fixed; left: 14px; bottom: 34px; z-index: 10;
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 999px; color: var(--ink);
    font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 14px; cursor: pointer;
  }
  .legend {
    position: fixed; left: 14px; bottom: 78px; z-index: 10; display: none;
    background: var(--glass-2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
    font-size: 12.5px; max-width: 240px;
  }
  .legend.open { display: block; }
  .legend .t { font-weight: 700; font-size: 12px; margin-bottom: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .legend .r { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .legend .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }

  /* markers */
  .mk {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.92);
    box-shadow: 0 1px 6px rgba(0,0,0,0.55);
    cursor: pointer; transition: transform 0.15s ease;
  }
  .mk:hover { transform: scale(1.25); }
  .mk.sel { transform: scale(1.45); border-color: #fff; }
  .mk.past { opacity: 0.35; }
  .mk .pulse {
    position: absolute; inset: -2.5px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.0);
  }

  /* bottom sheet */
  .sheet {
    position: fixed; left: 50%; transform: translate(-50%, 110%); bottom: 0; z-index: 20;
    width: min(560px, calc(100% - 20px));
    background: var(--glass-2); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-bottom: none;
    border-radius: 20px 20px 0 0; padding: 10px 20px calc(18px + env(safe-area-inset-bottom));
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    max-height: 62vh; overflow-y: auto;
  }
  .sheet.open { transform: translate(-50%, 0); }
  .grab { width: 40px; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.25); margin: 2px auto 12px; }
  .sheet .kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .pill {
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,0.10); color: var(--muted);
  }
  .pill.src { color: #101414; background: var(--srcc, #fff); }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; line-height: 1.25; letter-spacing: -0.2px; }
  .sheet .where { color: var(--muted); font-size: 13.5px; margin-bottom: 10px; }
  .sheet .desc { font-size: 14.5px; line-height: 1.55; color: #dfe6e4; margin: 0 0 12px; }
  .meter { margin: 0 0 14px; }
  .meter .lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .meter .bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #d8c98f, #f0d98a); }
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; text-align: center; text-decoration: none; font: inherit; font-size: 14px; font-weight: 600;
    padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.08); color: var(--ink); cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #101414; }
  .close-x {
    position: absolute; top: 12px; right: 14px; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(255,255,255,0.07); color: var(--ink);
    font-size: 15px; cursor: pointer; line-height: 1;
  }
  .updated {
    position: fixed; right: 14px; bottom: 34px; z-index: 10;
    font-size: 11px; color: var(--muted);
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .empty {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
    background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 20px; font-size: 14px; color: var(--muted); display: none;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .empty.show { display: block; }
  @media (max-width: 560px) {
    .brand small { display: none; }
    .brand { font-size: 13.5px; }
    .legend { max-width: 200px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="row1">
    <div class="brand">North Country Events<small>Radar &middot; Potsdam / Canton / St. Lawrence County</small></div>
    <input id="search" type="search" placeholder="Search events or places" autocomplete="off" />
  </div>
  <div class="chips" id="chips">
    <button class="chip on" data-f="upcoming">Upcoming</button>
    <button class="chip" data-f="ongoing">Ongoing</button>
    <button class="chip" data-f="past">Past</button>
    <button class="chip" data-f="all">All</button>
    <span class="count" id="count"></span>
  </div>
</div>

<button class="legend-toggle" id="legendToggle">Who published it</button>
<div class="legend" id="legend"><div class="t">Who published it</div></div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <button class="close-x" id="closeSheet" aria-label="Close">&times;</button>
  <div class="kicker" id="sheetKicker"></div>
  <h2 id="sheetTitle"></h2>
  <div class="where" id="sheetWhere"></div>
  <p class="desc" id="sheetDesc"></p>
  <div class="meter" id="sheetMeter" style="display:none">
    <div class="lab"><span>Fun potential</span><span id="meterVal"></span></div>
    <div class="bar"><div class="fill" id="meterFill"></div></div>
  </div>
  <div class="actions" id="sheetActions"></div>
</div>

<div class="empty" id="empty">No events match. Try another search or filter.</div>
<div class="updated" id="updated"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";
  var SRC_COLORS = {
    "Clarkson announcements": "#7fc4d8",
    "Clarkson email": "#8fd6a4",
    "Clarkson library": "#e8a0a0",
    "Email listing": "#ff8a5c",
    "Visit STLC": "#f0bd37"
  };
  var CARTO_ATTR = "Tiles \u00A9 <a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\">OpenStreetMap</a> contributors \u00A9 <a href=\"https://carto.com/attributions\" target=\"_blank\">CARTO</a>";

  var map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        "basemap": {
          type: "raster",
          tiles: ["https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png"],
          tileSize: 256, maxzoom: 20, attribution: CARTO_ATTR
        }
      },
      layers: [
        { id: "basemap", type: "raster", source: "basemap" }
      ]
    },
    center: [-75.03, 44.64],
    zoom: 10,
    attributionControl: { compact: true }
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "right");

  var state = { filter: "upcoming", q: "", events: [], markers: {}, selected: null };

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function bucket(e) {
    if (!e.date) return "ongoing";
    return e.date < todayStr() ? "past" : "upcoming";
  }
  function fmtDate(ds) {
    if (!ds) return "Ongoing";
    var d = new Date(ds + "T12:00:00");
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }

  function buildLegend() {
    var lg = document.getElementById("legend");
    var seen = {};
    state.events.forEach(function (e) { seen[e.source] = true; });
    Object.keys(seen).sort().forEach(function (s) {
      var c = SRC_COLORS[s] || "#ffffff";
      var r = document.createElement("div");
      r.className = "r";
      var d = document.createElement("span");
      d.className = "dot"; d.style.background = c;
      var t = document.createElement("span");
      t.textContent = s;
      r.appendChild(d); r.appendChild(t); lg.appendChild(r);
    });
  }

  function visible(e) {
    var b = bucket(e);
    var okF = state.filter === "all" || b === state.filter ||
      (state.filter === "upcoming" && (b === "upcoming" || b === "ongoing"));
    if (!okF) return false;
    if (state.q) {
      var hay = (e.title + " " + e.venue + " " + e.town + " " + e.desc).toLowerCase();
      if (hay.indexOf(state.q) < 0) return false;
    }
    return true;
  }

  function renderMarkers() {
    Object.keys(state.markers).forEach(function (id) { state.markers[id].remove(); });
    state.markers = {};
    var n = 0;
    state.events.forEach(function (e) {
      if (!visible(e)) return;
      n++;
      var el = document.createElement("div");
      el.className = "mk" + (bucket(e) === "past" ? " past" : "");
      el.style.background = SRC_COLORS[e.source] || "#fff";
      el.title = e.title;
      el.addEventListener("click", function (ev) { ev.stopPropagation(); openSheet(e.id); });
      var m = new maplibregl.Marker({ element: el }).setLngLat([e.lng, e.lat]).addTo(map);
      state.markers[e.id] = m;
    });
    document.getElementById("count").textContent = n + (n === 1 ? " event" : " events");
    document.getElementById("empty").classList.toggle("show", n === 0);
    if (state.selected && !state.markers[state.selected]) closeSheet();
  }

  function openSheet(id) {
    var e = null;
    state.events.forEach(function (x) { if (x.id === id) e = x; });
    if (!e) return;
    state.selected = id;
    Object.keys(state.markers).forEach(function (k) {
      var el = state.markers[k].getElement();
      if (el) el.classList.toggle("sel", k === id);
    });
    var b = bucket(e);
    var kick = document.getElementById("sheetKicker");
    kick.innerHTML = "";
    function pill(txt, cls, color) {
      var s = document.createElement("span");
      s.className = "pill" + (cls ? " " + cls : "");
      s.textContent = txt;
      if (color) s.style.setProperty("--srcc", color);
      kick.appendChild(s);
    }
    pill(b === "ongoing" ? "Ongoing" : fmtDate(e.date));
    if (b === "past") pill("Past");
    if (e.approx) pill("Approx. location");
    pill(e.source, "src", SRC_COLORS[e.source] || "#fff");
    document.getElementById("sheetTitle").textContent = e.title;
    document.getElementById("sheetWhere").textContent = e.venue + " \u00B7 " + e.town;
    document.getElementById("sheetDesc").textContent = e.desc || "";
    var meter = document.getElementById("sheetMeter");
    if (typeof e.score === "number") {
      meter.style.display = "";
      document.getElementById("meterVal").textContent = e.score + " / 100";
      document.getElementById("meterFill").style.width = Math.max(0, Math.min(100, e.score)) + "%";
    } else { meter.style.display = "none"; }
    var acts = document.getElementById("sheetActions");
    acts.innerHTML = "";
    if (e.link) {
      var a = document.createElement("a");
      a.className = "btn primary"; a.href = e.link; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Event details";
      acts.appendChild(a);
    }
    var d = document.createElement("a");
    d.className = "btn" + (e.link ? "" : " primary");
    d.href = "https://www.google.com/maps/search/?api=1&query=" + e.lat + "," + e.lng;
    d.target = "_blank"; d.rel = "noopener";
    d.textContent = "Directions";
    acts.appendChild(d);
    document.getElementById("sheet").classList.add("open");
    map.flyTo({ center: [e.lng, e.lat], zoom: Math.max(map.getZoom(), 13), duration: 600 });
  }
  function closeSheet() {
    state.selected = null;
    document.getElementById("sheet").classList.remove("open");
    Object.keys(state.markers).forEach(function (k) {
      var el = state.markers[k].getElement();
      if (el) el.classList.remove("sel");
    });
  }
  document.getElementById("closeSheet").addEventListener("click", closeSheet);

  document.getElementById("chips").addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip");
    if (!b) return;
    document.querySelectorAll("#chips .chip").forEach(function (c) { c.classList.remove("on"); });
    b.classList.add("on");
    state.filter = b.getAttribute("data-f");
    closeSheet(); renderMarkers();
  });
  var searchT = null;
  document.getElementById("search").addEventListener("input", function (ev) {
    clearTimeout(searchT);
    searchT = setTimeout(function () {
      state.q = ev.target.value.trim().toLowerCase();
      renderMarkers();
    }, 180);
  });
  document.getElementById("legendToggle").addEventListener("click", function () {
    document.getElementById("legend").classList.toggle("open");
  });

  fetch("./events.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("events.json " + r.status); return r.json(); })
    .then(function (data) {
      state.events = data.events || [];
      document.getElementById("updated").textContent = "Updated " + (data.updated || "");
      buildLegend();
      renderMarkers();
      var bounds = new maplibregl.LngLatBounds();
      state.events.forEach(function (e) { bounds.extend([e.lng, e.lat]); });
      if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 90, maxZoom: 12 });
    })
    .catch(function (err) {
      document.getElementById("empty").textContent = "Could not load events.json: " + err.message;
      document.getElementById("empty").classList.add("show");
    });
})();
</script>
</body>
</html>
