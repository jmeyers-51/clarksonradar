<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North Country -- grayscale map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body { height: 100%; margin: 0; background: #14161c; overflow: hidden; }
  #map { position: fixed; inset: 0; }
  .maplibregl-canvas { filter: grayscale(1) invert(0.93) brightness(1.04) contrast(0.95); }
  .maplibregl-ctrl-attrib { font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: #7c8595; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
var map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      basemap: {
        type: "raster",
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"],
        tileSize: 256, maxzoom: 19,
        attribution: "Tiles \u00A9 Esri \u2014 Source: Esri, HERE, Garmin, OpenStreetMap contributors, and the GIS user community"
      }
    },
    layers: [{ id: "basemap", type: "raster", source: "basemap" }]
  },
  center: [-74.98, 44.67], zoom: 10,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
</script>
</body>
</html>
