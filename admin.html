<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Admin</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #14161c; color: #e8eaf0; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
           padding: 12px 16px; background: #1a1d26; border-bottom: 1px solid #2a2e3c; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  #dirtyDot { width: 9px; height: 9px; border-radius: 50%; background: #e8b34b; display: none; }
  .btn { border: 1px solid #3a3f52; background: #232836; color: #e8eaf0; border-radius: 10px;
         padding: 10px 16px; font-size: 14px; cursor: pointer; }
  .btn.primary { background: #e8b34b; border-color: #e8b34b; color: #1a1a1a; font-weight: 700; }
  .btn.small { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
  .btn.danger { border-color: #7a3a3a; color: #f0a0a0; }
  .btn:disabled { opacity: .45; cursor: default; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
  #search { width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 12px;
            border: 1px solid #2a2e3c; background: #1a1d26; color: #e8eaf0; margin-bottom: 12px; }
  .card { background: #1c1f2a; border: 1px solid #2a2e3c; border-radius: 14px;
          padding: 14px; margin-bottom: 10px; }
  .card .top { display: flex; align-items: baseline; gap: 8px; }
  .card .name { font-weight: 700; font-size: 15px; flex: 1; }
  .card .meta { color: #9aa0b5; font-size: 12.5px; margin-top: 4px; }
  .card .actions { display: flex; gap: 8px; margin-top: 10px; }
  .chip { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px;
          background: #2a2e3c; color: #c9cede; }
  .chip.verified { background: rgba(95,169,104,.18); color: #8fd49a; }
  .chip.unverified { background: rgba(232,179,75,.12); color: #e8b34b; }
  .chip.approx { background: rgba(106,155,232,.15); color: #9dc0f0; }
  /* modal */
  #modal { position: fixed; inset: 0; z-index: 50; display: none;
           background: rgba(0,0,0,.6); align-items: flex-end; justify-content: center; }
  #modal.open { display: flex; }
  #sheet { background: #1c1f2a; width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto;
           border-radius: 18px 18px 0 0; padding: 18px 18px 30px; }
  #sheet h2 { margin: 0 0 14px; font-size: 17px; }
  label { display: block; font-size: 12.5px; color: #9aa0b5; margin: 12px 0 5px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 11px 12px; font-size: 15px; border-radius: 10px;
    border: 1px solid #2a2e3c; background: #14161c; color: #e8eaf0; }
  textarea { min-height: 70px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #pickMap { height: 240px; border-radius: 12px; margin-top: 6px; border: 1px solid #2a2e3c; }
  .hint { font-size: 12px; color: #9aa0b5; margin-top: 5px; }
  .sheetbtns { display: flex; gap: 10px; margin-top: 18px; }
  .sheetbtns .btn { flex: 1; padding: 13px; font-size: 15px; }
  /* toast */
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px);
           background: #232836; border: 1px solid #3a3f52; color: #e8eaf0; padding: 12px 20px;
           border-radius: 12px; font-size: 14px; z-index: 100; transition: transform .25s; max-width: 90vw; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  /* settings */
  #settings { display: none; }
  #settings.open { display: block; }
  .kbd { font-family: monospace; background: #14161c; padding: 2px 7px; border-radius: 6px; font-size: 12.5px; }
  @media (min-width: 700px) { #modal { align-items: center; } #sheet { border-radius: 18px; } }
</style>
</head>
<body>
<header>
  <h1>Radar Admin</h1>
  <span id="dirtyDot" title="Unsaved changes"></span>
  <button class="btn" id="settingsBtn" title="Settings">&#9881;</button>
  <button class="btn primary" id="publishBtn">Publish</button>
</header>
<main>
  <div id="settings" class="card">
    <h2 style="margin:0 0 8px;font-size:16px">Settings</h2>
    <p class="hint">Publishing writes straight to GitHub. Paste a personal access token once -- it stays in this browser, never in the code.</p>
    <label>GitHub personal access token (classic, <span class="kbd">repo</span> scope)</label>
    <input type="text" id="tokenInput" placeholder="ghp_..." autocomplete="off">
    <div class="sheetbtns">
      <button class="btn" id="saveTokenBtn">Save token</button>
      <button class="btn" id="testTokenBtn">Test</button>
    </div>
    <p class="hint">Create one at github.com &rarr; Settings &rarr; Developer settings &rarr; Personal access tokens &rarr; Tokens (classic) &rarr; Generate new &rarr; check <span class="kbd">repo</span>.</p>
  </div>
  <input id="search" type="text" placeholder="Search places" autocomplete="off">
  <button class="btn primary" id="addBtn" style="width:100%;margin-bottom:14px">+ Add place</button>
  <div id="list"></div>
</main>

<div id="modal"><div id="sheet">
  <h2 id="sheetTitle">Edit place</h2>
  <input type="hidden" id="fId">
  <label>Name</label><input type="text" id="fName">
  <div class="row2">
    <div><label>Category</label><select id="fCat"></select></div>
    <div><label>Town</label><input type="text" id="fTown"></div>
  </div>
  <label>Address</label><input type="text" id="fAddr">
  <label>Pin location -- tap the map</label>
  <div id="pickMap"></div>
  <div class="row2">
    <div><label>Latitude</label><input type="number" id="fLat" step="0.000001"></div>
    <div><label>Longitude</label><input type="number" id="fLng" step="0.000001"></div>
  </div>
  <label><input type="checkbox" id="fApprox" style="width:auto"> Approximate location</label>
  <label>Notes</label><textarea id="fDesc"></textarea>
  <div class="sheetbtns">
    <button class="btn" id="cancelBtn">Cancel</button>
    <button class="btn primary" id="saveBtn">Save</button>
  </div>
</div></div>
<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";
  var REPO = "jmeyers-51/clarksonradar", BRANCH = "main";
  var CATS = ["Food", "Coffee", "Outdoors", "Orchard", "Entertainment", "Study", "Venues", "Campus"];
  var PALETTE = { Food: "#e2a63b", Coffee: "#c08252", Outdoors: "#5fa968", Orchard: "#db6e5c",
                  Entertainment: "#a281e8", Study: "#6a9be8", Venues: "#e08bb0", Campus: "#7fc4c4" };
  var places = [], dirty = false, query = "";
  var SAVE_KEY = "radar-admin-v2";

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function today() { var d = new Date(); return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove("show"); }, 3200); }

  /* ---------- persistence (local safety net) ---------- */
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ savedAt: Date.now(), dirty: dirty, places: places })); } catch (e) {}
  }
  function restore() {
    try {
      var d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (d && d.dirty && Date.now() - d.savedAt < 7 * 864e5) return d.places;
    } catch (e) {}
    return null;
  }
  function markDirty() { dirty = true; $("dirtyDot").style.display = ""; persist(); }

  /* ---------- list ---------- */
  function render() {
    var list = $("list"); list.innerHTML = "";
    var q = query.trim().toLowerCase();
    var shown = places.filter(function (p) {
      return !q || (p.name + " " + (p.town || "") + " " + (p.category || "")).toLowerCase().indexOf(q) >= 0;
    });
    $("addBtn").textContent = "+ Add place (" + places.length + " total)";
    shown.forEach(function (p) {
      var d = document.createElement("div"); d.className = "card";
      var chips = '<span class="chip" style="border-left:3px solid ' + (PALETTE[p.category] || "#888") + '">' +
        esc(p.category || "?") + "</span> ";
      chips += p.verified ? '<span class="chip verified">verified ' + esc(p.verified) + "</span>"
                          : '<span class="chip unverified">unverified</span>';
      if (p.approx) chips += ' <span class="chip approx">approx</span>';
      d.innerHTML = '<div class="top"><div class="name">' + esc(p.name) + "</div></div>" +
        '<div class="meta">' + esc(p.town || "") + (p.address ? " &middot; " + esc(p.address) : "") + "</div>" +
        '<div style="margin-top:7px">' + chips + "</div>" +
        (p.desc ? '<div class="meta" style="margin-top:6px">' + esc(p.desc) + "</div>" : "") +
        '<div class="actions">' +
          '<button class="btn small" data-a="edit">Edit</button>' +
          (p.verified ? "" : '<button class="btn small" data-a="verify">Mark verified</button>') +
          '<button class="btn small danger" data-a="del">Delete</button>' +
        "</div>";
      d.querySelectorAll("button").forEach(function (b) {
        b.addEventListener("click", function () {
          var a = b.dataset.a;
          if (a === "edit") openEditor(p.id);
          else if (a === "verify") { p.verified = today(); markDirty(); render(); toast("Verified " + p.name); }
          else if (a === "del") {
            if (confirm("Delete " + p.name + "?")) {
              places = places.filter(function (x) { return x.id !== p.id; });
              markDirty(); render(); toast("Deleted " + p.name);
            }
          }
        });
      });
      list.appendChild(d);
    });
    if (!shown.length) list.innerHTML = '<div class="card"><div class="meta">No places match.</div></div>';
  }

  /* ---------- editor ---------- */
  var pickMap = null, pickMarker = null;
  function openEditor(id) {
    var p = places.find(function (x) { return x.id === id; });
    var isNew = !p;
    if (isNew) p = { id: "pl-" + Date.now().toString(36), category: "Outdoors", verified: null,
                     approx: false, status: "open", source: "Direct knowledge" };
    $("sheetTitle").textContent = isNew ? "Add place" : "Edit place";
    $("fId").value = p.id;
    $("fName").value = p.name || "";
    $("fCat").innerHTML = CATS.map(function (c) {
      return '<option' + (c === p.category ? " selected" : "") + ">" + c + "</option>"; }).join("");
    $("fTown").value = p.town || "";
    $("fAddr").value = p.address || "";
    $("fLat").value = p.lat != null ? p.lat : "";
    $("fLng").value = p.lng != null ? p.lng : "";
    $("fApprox").checked = !!p.approx;
    $("fDesc").value = p.desc || "";
    $("modal").classList.add("open");
    setTimeout(function () {
      if (!pickMap) {
        pickMap = new maplibregl.Map({ container: "pickMap",
          style: "https://tiles.basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
          center: [-74.98, 44.66], zoom: 10 });
        pickMap.on("click", function (e) {
          $("fLat").value = e.lngLat.lat.toFixed(6);
          $("fLng").value = e.lngLat.lng.toFixed(6);
          setPickMarker(e.lngLat.lat, e.lngLat.lng);
        });
      } else { pickMap.resize(); }
      if (p.lat != null && p.lng != null) {
        pickMap.jumpTo({ center: [p.lng, p.lat], zoom: 13 });
        setPickMarker(p.lat, p.lng);
      } else if (pickMarker) { pickMarker.remove(); pickMarker = null; }
    }, 60);
  }
  function setPickMarker(lat, lng) {
    if (pickMarker) pickMarker.remove();
    pickMarker = new maplibregl.Marker({ color: "#e8b34b" }).setLngLat([lng, lat]).addTo(pickMap);
  }
  function closeEditor() { $("modal").classList.remove("open"); }
  $("cancelBtn").addEventListener("click", closeEditor);
  $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeEditor(); });
  $("saveBtn").addEventListener("click", function () {
    var id = $("fId").value;
    var lat = parseFloat($("fLat").value), lng = parseFloat($("fLng").value);
    if (!$("fName").value.trim()) { toast("Name is required"); return; }
    if (isNaN(lat) || isNaN(lng)) { toast("Tap the map to set the pin"); return; }
    var p = places.find(function (x) { return x.id === id; });
    var rec = { id: id, name: $("fName").value.trim(), category: $("fCat").value,
      town: $("fTown").value.trim(), address: $("fAddr").value.trim(),
      lat: lat, lng: lng, approx: $("fApprox").checked, desc: $("fDesc").value.trim(),
      link: (p && p.link) || null, source: "Direct knowledge",
      status: (p && p.status) || "open", verified: (p && p.verified) || null };
    if (p) places[places.indexOf(p)] = rec; else { rec.verified = today(); places.push(rec); }
    markDirty(); render(); closeEditor();
    toast("Saved " + rec.name);
  });
  $("addBtn").addEventListener("click", function () { openEditor(null); });
  $("search").addEventListener("input", function (e) { query = e.target.value; render(); });

  /* ---------- publish straight to GitHub ---------- */
  function token() { return (localStorage.getItem("radar-gh-token") || "").trim(); }
  $("settingsBtn").addEventListener("click", function () { $("settings").classList.toggle("open"); });
  $("saveTokenBtn").addEventListener("click", function () {
    localStorage.setItem("radar-gh-token", $("tokenInput").value.trim());
    toast("Token saved in this browser");
  });
  $("testTokenBtn").addEventListener("click", async function () {
    var t = $("tokenInput").value.trim() || token();
    if (!t) { toast("Paste a token first"); return; }
    try {
      var r = await fetch("https://api.github.com/repos/" + REPO, {
        headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" } });
      toast(r.ok ? "Token works -- repo reachable" : "Token failed: " + r.status);
    } catch (e) { toast("Network error: " + e.message); }
  });
  if (token()) $("tokenInput").value = token();

  $("publishBtn").addEventListener("click", async function () {
    var t = token();
    if (!t) { $("settings").classList.add("open"); toast("Paste your GitHub token first (Settings)"); return; }
    if (!dirty && !confirm("No unsaved changes. Publish anyway?")) return;
    var btn = $("publishBtn"); btn.disabled = true; btn.textContent = "Publishing...";
    try {
      var get = await fetch("https://api.github.com/repos/" + REPO + "/contents/places.json?ref=" + BRANCH, {
        headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" } });
      if (!get.ok) throw new Error("read failed: " + get.status);
      var meta = await get.json();
      var body = { updated: today(), places: places };
      var content = btoa(unescape(encodeURIComponent(JSON.stringify(body, null, 1))));
      var put = await fetch("https://api.github.com/repos/" + REPO + "/contents/places.json", {
        method: "PUT",
        headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json",
                   "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Admin: update places (" + places.length + ")",
                               content: content, sha: meta.sha, branch: BRANCH })
      });
      if (!put.ok) { var err = await put.json().catch(function(){return{};});
        throw new Error("write failed: " + put.status + " " + (err.message || "")); }
      dirty = false; $("dirtyDot").style.display = "none"; persist();
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      toast("Published -- live in ~2 minutes");
    } catch (e) {
      toast("Publish failed: " + e.message);
    }
    btn.disabled = false; btn.textContent = "Publish";
  });

  /* ---------- boot ---------- */
  fetch("./places.json", { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (d) {
      places = d.places || [];
      var sv = restore();
      if (sv) { places = sv; dirty = true; $("dirtyDot").style.display = "";
        toast("Restored unsaved work from this browser"); }
      render();
    })
    .catch(function (e) { $("list").innerHTML = '<div class="card">Could not load places.json</div>'; });
})();
</script>
</body>
</html>
